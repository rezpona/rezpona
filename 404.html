  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#060612;--acc:#00CEFF;--acc2:#5B6FFF;--text:#EEF2FF;--muted:#6B7B92;--muted2:#8A99B2;--bd:rgba(255,255,255,0.075);--s1:rgba(255,255,255,.022);--s2:rgba(255,255,255,.035);--s3:rgba(255,255,255,.06);--on-acc:#060612;--scrim:rgba(3,3,12,.72);--pos:#00FF94;--neg:#FF4466;--neu:#FFB800;--shadow:rgba(0,0,0,.45);--bg2:#0a0a1c;--bd2:rgba(255,255,255,.12);--card:rgba(255,255,255,.025)}
:root[data-theme="light"]{
  --bg:#F6F7FB;--bg2:#FFFFFF;
  --text:#0B1120;--muted:#64748B;--muted2:#475569;
  --bd:rgba(11,17,32,.10);--bd2:rgba(11,17,32,.20);
  --card:#FFFFFF;--s1:#FFFFFF;--s2:rgba(11,17,32,.035);--s3:rgba(11,17,32,.065);
  --acc:#0A86B4;--acc2:#3F52D9;--on-acc:#FFFFFF;
  --pos:#0E9F6E;--neg:#DC2626;--neu:#B45309;
  --shadow:rgba(11,17,32,.10);--scrim:rgba(11,17,32,.45);
}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:1.5rem;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;pointer-events:none;width:520px;height:520px;
  background:radial-gradient(circle,rgba(0,206,255,.07),transparent 70%);top:-160px;left:-160px}
.box{position:relative;z-index:1;max-width:460px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:.55rem;text-decoration:none;color:var(--text);margin-bottom:2.6rem}
.logo img{height:26px;width:auto}
.logo span{font-size:1.15rem;font-weight:700;letter-spacing:-.02em}
.logo span i{font-style:normal;background:linear-gradient(135deg,var(--acc),var(--acc2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.code{font-family:'Fraunces',serif;font-weight:200;font-size:4.6rem;line-height:1;
  background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.6rem}
h1{font-family:'Fraunces',serif;font-weight:300;font-size:1.5rem;letter-spacing:-.02em;margin-bottom:.7rem}
p{font-size:.92rem;color:var(--muted2);font-weight:300;line-height:1.7;margin-bottom:2rem}
.row{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
.btn{padding:.75rem 1.7rem;border-radius:100px;text-decoration:none;font-size:.88rem;font-weight:600;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on-acc);
  box-shadow:0 4px 20px rgba(0,206,255,.25);transition:transform .2s}
.btn:hover{transform:translateY(-1px)}
.btn-o{background:none;border:1px solid var(--bd);color:var(--text);box-shadow:none;font-weight:400}
.btn-o:hover{border-color:rgba(0,206,255,.35);color:var(--acc)}
.small{margin-top:2.4rem;font-size:.82rem;color:var(--muted)}
.small a{color:var(--muted2)}
@media(max-width:480px){.code{font-size:3.6rem}h1{font-size:1.3rem}}
  </style>
  <script src="/assets/theme.js" defer></script>
</head>
